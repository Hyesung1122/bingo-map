<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글쓰기 | BinGo Map</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/community/community.css">
    <!-- [10/01 유해성] 헤더 로그인 상태(이름님/로그아웃/관리자 페이지) 표시 -->
    <script src="/js/header-auth.js"></script>
</head>
<body>
<header class="header">
    <div class="header-inner">
        <a class="logo" href="/">
            <span class="logo-mark">♜</span>
            <span><strong>BinGo Map</strong><small>Clean &amp; Gourmet</small></span>
        </a>
        <nav class="nav">
            <a href="/">홈</a>
            <a href="/map">지도</a>
            <a href="/restaurants">주변 맛집</a>
            <a href="/favorites">즐겨찾기</a>
            <a href="/reviews">리뷰</a>
            <a class="active" href="/community">커뮤니티</a>
            <a href="/notices">공지사항</a>
        </nav>
        <div class="header-actions">
            <button class="language">🇰🇷 한국어 <span>⌄</span></button>
            <a class="login" href="/login">로그인</a>
        </div>
    </div>
</header>

<main>
    <div class="board-wrap" style="max-width:640px;">
        <div class="board-top"><h2>글쓰기</h2></div>

        <div class="board-write-card">
            <form id="post-form">
                <!-- [10/01 유해성] 말머리 (공지는 관리자에게만 보임) -->
                <div class="board-field">
                    <label>말머리</label>
                    <select id="category">
                        <option value="자유">자유</option>
                        <option value="질문">질문</option>
                        <option value="꿀팁">꿀팁</option>
                        <option value="요청">요청 (정보 수정·쓰레기통 추가·버그·건의)</option>
                        <option value="공지" id="notice-option" hidden disabled>📌 공지 (관리자)</option>
                    </select>
                    <label class="board-check" id="private-wrap" style="display:none;font-weight:400;">
                        <input type="checkbox" id="private-request">
                        비공개로 요청하기 (작성자와 관리자만 볼 수 있어요)
                    </label>
                </div>

                <div class="board-field">
                    <label>제목</label>
                    <input type="text" id="title" maxlength="200" placeholder="제목을 입력해주세요" required>
                </div>

                <div class="board-field">
                    <label>내용</label>
                    <textarea id="content" placeholder="내용을 입력해주세요" required></textarea>
                </div>

                <button type="submit" class="board-submit-btn" id="submit-btn">등록</button>
            </form>
        </div>
    </div>
</main>

<footer class="footer">
    <div class="footer-inner">
        <div class="footer-brand">
            <span class="logo-mark">♜</span>
            <span><strong>BinGo Map</strong><small>Clean &amp; Gourmet</small></span>
        </div>
        <p>BinGo Map은 깨끗한 일본 여행 문화를 응원합니다.<br>모두가 함께 만들어가는 깨끗하고 즐거운 여행 플랫폼!</p>
        <div class="footer-links">
            <div>◎　♥　f</div>
            <small>이용약관　　개인정보처리방침　　문의하기</small>
            <small>© 2025 BinGo Map. All rights reserved.</small>
        </div>
        <a class="top-btn" href="#">↑<small>TOP</small></a>
    </div>
</footer>

<script>
// [09/30 유해성] 작성자는 서버가 로그인 정보로 저장 (임시 id 1 제거)

const params = new URLSearchParams(location.search);
const editId = params.get('edit');
let existingTags = '';   // [10/01 유해성] 수정 시 기존 태그 보존용

// ── [09/30 유해성] 비로그인이면 로그인 페이지로, 수정은 작성자 본인 / 관리자만 ──
const loginReady = fetch('/api/reviews/current-user', { cache: 'no-store' })
    .then(res => res.ok ? res.json() : { loggedIn: false })
    .catch(() => ({ loggedIn: false }));

loginReady.then(u => {
    if (!u.loggedIn) {
        alert('로그인한 회원만 글을 쓸 수 있습니다.');
        location.href = '/login?returnUrl=' + encodeURIComponent('/community');   // [10/01 유해성] 로그인 후 커뮤니티로 복귀
        return;
    }
    // [10/01 유해성] 관리자만 공지 말머리 선택 가능
    if (u.role === 'ADMIN') {
        const notice = document.getElementById('notice-option');
        notice.hidden = false;
        notice.disabled = false;
    }
});

// [10/01 유해성] 말머리가 "요청"일 때만 비공개 체크박스 표시
const categoryEl = document.getElementById('category');
const privateEl = document.getElementById('private-request');
function syncPrivateBox() {
    const isRequest = categoryEl.value === '요청';
    document.getElementById('private-wrap').style.display = isRequest ? 'flex' : 'none';
    if (!isRequest) privateEl.checked = false;
}
categoryEl.addEventListener('change', syncPrivateBox);

// 탭에서 "관리자에게 요청"을 보고 들어온 경우 등: /community/write?category=요청
if (params.get('category')) {
    categoryEl.value = params.get('category');
    if (!categoryEl.value) categoryEl.value = '자유';
    syncPrivateBox();
}

if (editId) {
    document.querySelector('.board-top h2').textContent = '글 수정';
    document.getElementById('submit-btn').textContent = '수정 완료';
    (async () => {
        try {
            const u = await loginReady;
            if (!u.loggedIn) return;
            const res = await fetch(`/api/community/${editId}`);
            if (!res.ok) throw new Error('not found');
            const p = await res.json();
            if (u.role !== 'ADMIN' && String(u.userId) !== String(p.userId)) {
                alert('본인이 작성한 게시글만 수정할 수 있습니다.');
                location.href = `/community/${editId}`;
                return;
            }
            document.getElementById('title').value = p.title || '';
            document.getElementById('content').value = p.content || '';
            // [10/01 유해성] 태그 입력칸은 없앴지만, 예전 글의 태그는 수정해도 그대로 유지
            existingTags = (p.tags || []).join(', ');
            // [10/01 유해성] 기존 말머리 / 비공개 여부 불러오기
            if (p.category === '공지') {
                const notice = document.getElementById('notice-option');
                notice.hidden = false;
                notice.disabled = false;
            }
            categoryEl.value = p.category || '자유';
            syncPrivateBox();
            privateEl.checked = !!p.privateRequest;
        } catch (e) {
            alert('글 정보를 불러오지 못했습니다.');
        }
    })();
}

const form = document.getElementById('post-form');
const submitBtn = document.getElementById('submit-btn');

form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const title = document.getElementById('title').value.trim();
    const content = document.getElementById('content').value.trim();
    const tags = existingTags;   // [10/01 유해성] 새 글은 태그 없음

    if (!title) { alert('제목을 입력해주세요.'); return; }
    if (!content) { alert('내용을 입력해주세요.'); return; }

    submitBtn.disabled = true;
    submitBtn.textContent = editId ? '수정 중...' : '등록 중...';

    try {
        const url = editId ? `/api/community/${editId}` : '/api/community';
        const method = editId ? 'PUT' : 'POST';
        const res = await fetch(url, {
            method,
            headers: { 'Content-Type': 'application/json' },
            // [10/01 유해성] 말머리 / 비공개 여부 함께 전송
            body: JSON.stringify({
                title, content, tags,
                category: categoryEl.value,
                privateRequest: categoryEl.value === '요청' && privateEl.checked
            })
        });
        if (res.status === 400) {
            alert('태그가 너무 길어요. 태그 수를 줄여주세요.');
            submitBtn.disabled = false;
            submitBtn.textContent = editId ? '수정 완료' : '등록';
            return;
        }
        if (res.status === 401) { alert('로그인이 필요합니다.'); location.href = '/login?returnUrl=' + encodeURIComponent(location.pathname + location.search); return; }
        if (res.status === 403) { alert('본인이 작성한 게시글만 수정할 수 있습니다.'); location.href = `/community/${editId}`; return; }
        if (!res.ok) throw new Error('failed');
        const saved = await res.json();
        location.href = `/community/${saved.postId ?? editId}`;
    } catch (err) {
        alert(editId ? '수정에 실패했습니다. 잠시 후 다시 시도해주세요.' : '등록에 실패했습니다. 잠시 후 다시 시도해주세요.');
        submitBtn.disabled = false;
        submitBtn.textContent = editId ? '수정 완료' : '등록';
    }
});
</script>
</body>
</html>
