<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>맛집 상세 정보 - BinGo Map</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <script src="/js/header-auth.js" defer></script>

    <style>
        body { background-color: #f8f9fa; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .navbar-brand-logo { font-weight: 800; color: #198754 !important; display: flex; align-items: center; gap: 8px; }
        .main-gallery-img { width: 100%; height: 380px; object-fit: cover; border-radius: 12px; background-color: #e9ecef; }
        .info-card { background: #fff; border-radius: 12px; padding: 24px; border: 1px solid #edf2f7; height: 100%; }
        .menu-thumb { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; background-color: #e9ecef; }
        .recommend-card { background: #fff; border-radius: 12px; border: 1px solid #edf2f7; overflow: hidden; transition: transform 0.2s; text-decoration: none; color: inherit; display: block; }
        .recommend-card:hover { transform: translateY(-3px); }
        .recommend-img { width: 100%; height: 130px; object-fit: cover; }
    </style>
    <link rel="stylesheet" href="/css/site-header.css">
</head>
<body>

<header class="bg-white border-bottom py-2 sticky-top">
    <div class="container d-flex align-items-center justify-content-between">
        <a href="/" class="navbar-brand-logo text-decoration-none fs-4">
            <i class="bi bi-trash3-fill fs-3 text-success"></i>
            <div>
                <div>BinGo Map</div>
                <div style="font-size: 0.65rem; color: #6c757d; font-weight: normal; margin-top: -4px;">Clean & Gourmet</div>
            </div>
        </a>
        <nav class="d-none d-md-flex gap-4 fw-semibold text-secondary">
            <a href="/" class="text-decoration-none text-secondary">홈</a>
            <a href="/map/map.html" class="text-decoration-none text-secondary">지도</a>
            <a href="/restaurants" class="text-decoration-none text-success border-bottom border-success border-2 pb-1">주변 맛집</a>
            <a href="/favorites" class="text-decoration-none text-secondary">즐겨찾기</a>
            <a href="/reviews" class="text-decoration-none text-secondary">리뷰</a>
            <a href="/community" class="text-decoration-none text-secondary">커뮤니티</a>
            <a href="/notices" class="text-decoration-none text-secondary">공지사항</a>
        </nav>
        <div class="d-flex align-items-center gap-3 header-actions">
            <a href="/login/login.html" class="btn btn-success btn-sm px-3 rounded-2 login">로그인</a>
        </div>
    </div>
</header>

<!-- 데이터 로딩 전/실패 시 -->
<main class="container my-5 text-center" id="notFoundBox" style="display:none;">
    <p class="text-muted">해당 가게 정보를 찾을 수 없습니다.</p>
    <a href="/restaurants" class="btn btn-sm btn-outline-secondary">목록으로 돌아가기</a>
</main>

<main class="container my-4" id="detailMain" style="display:none;">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <a href="/restaurants" class="text-decoration-none text-dark fw-medium small">
            <i class="bi bi-arrow-left"></i> 주변 맛집으로 돌아가기
        </a>
        <button type="button" id="favoriteToggle" aria-pressed="false" class="btn btn-outline-secondary btn-sm rounded-pill px-3 bg-white text-dark border-light shadow-sm">
            <i class="bi bi-heart text-secondary me-1" aria-hidden="true"></i> 즐겨찾기 저장
        </button>
    </div>

    <div class="row g-4 mb-4">
        <div class="col-lg-6">
            <img id="mainImage" src="" class="main-gallery-img" alt="가게 대표 사진">
        </div>

        <div class="col-lg-6 d-flex flex-column justify-content-between">
            <div>
                <div class="d-flex gap-2 mb-2">
                    <span class="badge bg-warning text-dark" id="categoryBadge">카테고리</span>
                    <span class="badge bg-success bg-opacity-10 text-success">인기 맛집</span>
                    <span class="badge bg-info bg-opacity-10 text-info">테이크아웃</span>
                </div>
                <h2 class="fw-bold mb-1" id="restaurantName">가게 이름</h2>
                <div class="d-flex align-items-center gap-3 mb-2 small">
                    <div class="text-warning">
                        <i class="bi bi-star-fill"></i>
                        <span class="fw-bold text-dark" id="rating">4.6</span>
                    </div>
                </div>
                <p class="text-secondary small mb-3" id="description">식당 한 줄 소개</p>
                <div class="small text-secondary d-flex flex-column gap-2 mb-3">
                    <div><i class="bi bi-geo-alt me-2 text-success"></i><span id="address">주소</span></div>
                    <div><i class="bi bi-clock me-2 text-success"></i><span id="openingHours">영업시간</span></div>
                    <div><i class="bi bi-telephone me-2 text-success"></i><span id="phoneText">전화번호</span></div>
                    <div><i class="bi bi-currency-yen me-2 text-success"></i><span id="priceRange">가격대</span></div>
                    <div id="websiteRow" style="display:none;"><i class="bi bi-globe me-2 text-success"></i><a id="websiteLink" href="#" target="_blank" class="text-decoration-none text-success">웹사이트</a></div>
                </div>
            </div>
            <div class="d-flex gap-2 pt-3 border-top">
                <a id="directionsLink" href="#" class="btn btn-outline-success btn-sm flex-fill d-flex align-items-center justify-content-center gap-1 py-2 fw-semibold text-decoration-none">
                    <i class="bi bi-signpost-split"></i> 길찾기
                </a>
                <a id="reviewLink" href="#" class="btn btn-outline-success btn-sm flex-fill d-flex align-items-center justify-content-center gap-1 py-2 fw-semibold text-decoration-none">
                    <i class="bi bi-chat-left-text"></i> 리뷰
                </a>
                <button type="button" onclick="shareCurrentPage()" class="btn btn-outline-success btn-sm flex-fill d-flex align-items-center justify-content-center gap-1 py-2 fw-semibold">
                    <i class="bi bi-share"></i> 공유하기
                </button>
            </div>
        </div>
    </div>

    <div class="row g-4 mb-4">
        <div class="col-lg-4">
            <div class="info-card">
                <h5 class="fw-bold mb-3">대표 메뉴</h5>
                <div class="d-flex align-items-center justify-content-between">
                    <div class="d-flex align-items-center gap-2">
                        <img id="menuImage" src="" class="menu-thumb" alt="메뉴 사진">
                        <div>
                            <div class="fw-bold small" id="menuName">대표 메뉴</div>
                            <div class="text-muted" style="font-size: 0.75rem;" id="menuDescription">설명</div>
                        </div>
                    </div>
                    <div class="fw-bold small text-dark" id="menuPrice">¥680</div>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="info-card">
                <h5 class="fw-bold mb-3">매장 정보</h5>
                <div class="small text-secondary d-flex flex-column gap-3">
                    <div class="d-flex justify-content-between"><span><i class="bi bi-shop me-2"></i>좌석</span><span class="fw-medium text-dark" id="seatInfo">없음</span></div>
                    <div class="d-flex justify-content-between"><span><i class="bi bi-calendar-check me-2"></i>예약</span><span class="fw-medium text-dark" id="reservationInfo">불가</span></div>
                    <div class="d-flex justify-content-between"><span><i class="bi bi-credit-card me-2"></i>결제 방법</span><span class="fw-medium text-dark" id="paymentMethods">현금</span></div>
                    <div class="d-flex justify-content-between"><span><i class="bi bi-translate me-2"></i>언어</span><span class="fw-medium text-dark" id="languages">일본어</span></div>
                    <div class="d-flex justify-content-between"><span><i class="bi bi-check2-circle me-2"></i>특징</span><span class="fw-medium text-dark">테이크아웃, 빠른 제공</span></div>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="info-card d-flex flex-column justify-content-between">
                <div>
                    <h5 class="fw-bold mb-3">위치</h5>

                    <iframe
                            id="restaurantLocationMap"
                            title="식당 위치 지도"
                            src="about:blank"
                            loading="lazy"
                            style="display:block; width:100%; height:220px; border:1px solid #dee2e6; border-radius:8px;">
                    </iframe>
                </div>
                <a id="mapLink" href="#" class="btn btn-outline-success btn-sm w-100 fw-semibold mt-2 text-decoration-none text-center">
                    지도로 크게 보기
                </a>
            </div>
        </div>
    </div>

    <div class="row mb-5">
        <div class="col-12">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="fw-bold m-0">주변 다른 맛집 추천</h5>
                <a id="moreLink" href="/restaurants" class="text-success small fw-semibold text-decoration-none">더 많은 맛집 보기 ></a>
            </div>
            <div class="row g-3" id="recommendGrid"></div>
        </div>
    </div>
</main>

<script>
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text ?? '';
        return div.innerHTML;
    }

    function getRestaurantIdFromUrl() {
        const params = new URLSearchParams(window.location.search);
        if (params.has('id')) return params.get('id');
        const parts = window.location.pathname.split('/').filter(Boolean);
        const last = parts[parts.length - 1];
        return /^\d+$/.test(last) ? last : '1';
    }

    function shareCurrentPage() {
        navigator.clipboard.writeText(window.location.href).then(() => {
            alert('현재 맛집 링크가 클립보드에 복사되었습니다!');
        }).catch(err => console.error('링크 복사 실패:', err));
    }

    function fillDetail(r) {
        document.getElementById('mainImage').src = r.mainImageUrl || 'https://images.unsplash.com/photo-1603133872878-684f208fb84b?auto=format&fit=crop&w=600&q=80';
        document.getElementById('categoryBadge').innerText = r.category || '타코야끼';
        document.getElementById('restaurantName').innerText = r.name;
        document.getElementById('rating').innerText = r.rating != null ? r.rating : '4.6';
        document.getElementById('description').innerText = r.description || '';
        document.getElementById('address').innerText = r.address || '주소 정보 없음';
        document.getElementById('openingHours').innerText = r.openingHours || '09:00 - 21:00';
        document.getElementById('phoneText').innerText = r.phone || '+81 6-6211-5512';
        document.getElementById('priceRange').innerText = r.priceRange || '1인당 ¥600 ~ ¥1,000';

        if (r.websiteUrl) {
            document.getElementById('websiteRow').style.display = '';
            const link = document.getElementById('websiteLink');
            link.href = r.websiteUrl;
            link.innerText = r.websiteUrl;
        }

        const restaurantId = r.restaurantId;
        document.getElementById('reviewLink').href = `/reviews/restaurant/${encodeURIComponent(restaurantId)}`;
        document.getElementById('directionsLink').href = `/map/map.html?lat=${r.latitude}&lon=${r.longitude}&name=${encodeURIComponent(r.name)}&route=true`;
        document.getElementById('mapLink').href = `/map/map.html?lat=${r.latitude}&lon=${r.longitude}&name=${encodeURIComponent(r.name)}`;

        document.getElementById('menuImage').src = r.menuImageUrl || 'https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=150&q=80';
        document.getElementById('menuName').innerText = r.menuName || '대표 메뉴';
        document.getElementById('menuDescription').innerText = r.menuDescription || '설명';
        const price = r.menuPrice;
        document.getElementById('menuPrice').innerText = price ? (price.startsWith('¥') ? price : '¥' + price) : '¥680';

        document.getElementById('seatInfo').innerText = r.seatInfo || '없음 (테이크아웃 전문)';
        document.getElementById('reservationInfo').innerText = r.reservationInfo || '불가';
        document.getElementById('paymentMethods').innerText = r.paymentMethods || '현금, 카드';
        document.getElementById('languages').innerText = r.languages || '일본어';

        document.getElementById('moreLink').href = `/restaurants?region=${r.region || 'dotonbori'}`;
        const locationParams = new URLSearchParams({
            lat: r.latitude == null ? '' : String(r.latitude),
            lon: r.longitude == null ? '' : String(r.longitude),
            name: r.name || '선택한 식당'
        });

        document.getElementById('restaurantLocationMap').src =
            '/restaurants/location-map.html?' + locationParams.toString();

        document.getElementById('mapLink').href =
            '/map/map.html?' + locationParams.toString();
    }

    function buildRecommendCardHtml(rec) {
        const image = rec.mainImageUrl || 'https://images.unsplash.com/photo-1603133872878-684f208fb84b?auto=format&fit=crop&w=200&q=80';
        return `
            <div class="col-md-2 col-6">
                <a class="recommend-card h-100" href="/restaurants/detail?id=${rec.restaurantId}">
                    <img src="${image}" class="recommend-img" alt="가게">
                    <div class="p-2">
                        <span class="badge bg-warning text-dark" style="font-size: 0.65rem;">추천</span>
                        <div class="fw-bold small text-dark mt-1 text-truncate">${escapeHtml(rec.name)}</div>
                        <div class="d-flex align-items-center justify-content-between small text-muted mt-1" style="font-size: 0.75rem;">
                            <span><i class="bi bi-star-fill text-warning"></i> ${rec.rating != null ? rec.rating : '4.0'}</span>
                            <span class="text-success fw-semibold">${escapeHtml(rec.category || '')}</span>
                        </div>
                    </div>
                </a>
            </div>`;
    }

    function setFavoriteButton(saved) {
        const button = document.getElementById('favoriteToggle');
        button.setAttribute('aria-pressed', String(saved));
        button.classList.toggle('btn-success', saved);
        button.classList.toggle('text-white', saved);
        button.classList.toggle('bg-white', !saved);
        button.classList.toggle('text-dark', !saved);
        button.classList.toggle('border-light', !saved);
        button.classList.toggle('btn-outline-secondary', !saved);
        button.innerHTML = saved
            ? '<i class="bi bi-heart-fill me-1" aria-hidden="true"></i> 즐겨찾기 저장됨'
            : '<i class="bi bi-heart me-1" aria-hidden="true"></i> 즐겨찾기 저장';
    }

    async function connectFavoriteButton(restaurant) {
        const button = document.getElementById('favoriteToggle');
        const restaurantId = String(restaurant.restaurantId || getRestaurantIdFromUrl());
        let favoriteId = null;
        button.disabled = true;

        async function sync() {
            const response = await fetch('/api/favorites/status?targetType=RESTAURANT', {
                credentials: 'same-origin',
                headers: { Accept: 'application/json' },
                cache: 'no-store'
            });
            if (response.status === 401) return false;
            if (!response.ok) throw new Error('즐겨찾기 상태를 확인하지 못했습니다.');
            const statuses = await response.json();
            const saved = statuses.find(item =>
                String(item.targetId) === restaurantId
            );
            favoriteId = saved ? saved.favoriteId : null;
            setFavoriteButton(Boolean(saved));
            return true;
        }

        try {
            await sync();
        } catch (error) {
            button.title = '즐겨찾기 상태를 불러오지 못했습니다.';
        } finally {
            button.disabled = false;
        }

        button.addEventListener('click', async () => {
            button.disabled = true;
            try {
                if (favoriteId == null) {
                    const response = await fetch('/api/favorites', {
                        method: 'POST',
                        credentials: 'same-origin',
                        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
                        body: JSON.stringify({
                            targetType: 'RESTAURANT',
                            targetId: restaurantId,
                            targetName: restaurant.name
                        })
                    });
                    if (response.status === 401) {
                        const returnUrl = window.location.pathname + window.location.search;
                        window.location.assign('/login?returnUrl=' + encodeURIComponent(returnUrl));
                        return;
                    }
                    if (response.status === 409) {
                        await sync();
                        return;
                    }
                    if (!response.ok) throw new Error('즐겨찾기에 저장하지 못했습니다.');
                    const saved = await response.json();
                    favoriteId = saved.id;
                    setFavoriteButton(true);
                } else {
                    const response = await fetch('/api/favorites/' + encodeURIComponent(favoriteId), {
                        method: 'DELETE',
                        credentials: 'same-origin'
                    });
                    if (response.status === 401) {
                        const returnUrl = window.location.pathname + window.location.search;
                        window.location.assign('/login?returnUrl=' + encodeURIComponent(returnUrl));
                        return;
                    }
                    if (!response.ok && response.status !== 204) {
                        throw new Error('즐겨찾기에서 삭제하지 못했습니다.');
                    }
                    favoriteId = null;
                    setFavoriteButton(false);
                }
            } catch (error) {
                button.title = error.message;
            } finally {
                button.disabled = false;
            }
        });
    }

    document.addEventListener("DOMContentLoaded", async function () {
        const id = getRestaurantIdFromUrl();

        try {
            const res = await fetch(`/api/restaurants/${id}`);
            if (!res.ok) throw new Error('식당을 찾을 수 없습니다.');
            const restaurant = await res.json();

            fillDetail(restaurant);
            document.getElementById('detailMain').style.display = '';
            connectFavoriteButton(restaurant);

            const nearbyRes = await fetch(`/api/restaurants/${id}/nearby?limit=4`);
            const nearbyList = nearbyRes.ok ? await nearbyRes.json() : [];
            const grid = document.getElementById('recommendGrid');

            if (nearbyList.length === 0) {
                grid.innerHTML = '<div class="col-12 text-muted small py-3">근처에 추천할 맛집이 없습니다.</div>';
            } else {
                grid.innerHTML = nearbyList.map(buildRecommendCardHtml).join('');
            }
        } catch (err) {
            console.error(err);
            document.getElementById('notFoundBox').style.display = '';
        }
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
