<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>리뷰 | BinGo Map</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/reviews/reviews.css">
<style>
.rv-toolbar{display:block}.rv-toolbar #origin-status{margin-top:8px!important}.rv-refresh{margin-bottom:12px}.rv-search:focus{outline:2px solid #159b35;outline-offset:2px}.rv-card-link{display:block;color:inherit;text-decoration:none}.rv-actions{display:flex;gap:8px;margin-top:12px}.rv-actions a{border:1px solid #159b35;border-radius:8px;padding:8px 12px;color:#159b35;text-decoration:none;font-size:13px}.rv-actions a:last-child{background:#159b35;color:white}.rv-search{box-sizing:border-box;width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin-bottom:12px}.rv-message{color:#765b23;font-size:13px}.rv-refresh{border:1px solid #ddd;border-radius:20px;background:white;padding:8px 12px;cursor:pointer}.rv-card:focus-within{outline:2px solid #159b35}.rv-empty{grid-column:1/-1;padding:30px;text-align:center;color:#666}.rv-thumb-wrap img{width:100%;height:100%;object-fit:cover}.rv-placeholder{display:grid;place-items:center;height:100%;background:#f5f6f5;color:#777}.rv-rating-picker{display:flex;gap:8px}.rv-rating-picker button{background:#fff;border:1px solid #bbb;border-radius:8px;padding:10px;color:#896600;font-size:22px;cursor:pointer}.rv-rating-picker button[aria-pressed="true"]{border-color:#159b35;background:#edf9ef}#rd-stats{color:#16883a;margin:10px 0}#write-status{font-size:13px;line-height:1.6}#rv-warning:empty{display:none}@media(max-width:600px){.rv-toolbar select{max-width:100%}.rv-actions{flex-wrap:wrap}.review-wrap{padding:24px 16px}.rd-carousel{max-width:100%}}
</style>
</head>
<body>
<header class="header">
    <div class="header-inner">
        <a class="logo" href="/">
            <span class="logo-mark">♜</span>
            <span>
                <strong>BinGo Map</strong>
                <small>Clean &amp; Gourmet</small>
            </span>
        </a>
        <nav class="nav">
            <a href="/">홈</a>
            <a href="/map">지도</a>
            <a href="/restaurants">주변 맛집</a>
            <a href="/favorites">즐겨찾기</a>
            <a class="active" href="/reviews">리뷰</a>
            <a href="/notices">공지사항</a>
        </nav>
        <div class="header-actions">
            <button class="language">🇰🇷 한국어 <span>⌄</span></button>
            <a class="login" href="/login">로그인</a>
        </div>
    </div>
</header>

<main>
    <div class="review-wrap" style="max-width:1080px;">
        <div class="review-top">
            <h2>맛집 리뷰</h2>
        </div>

        <input class="rv-search" id="restaurant-search" aria-label="식당 검색" placeholder="식당 이름, 주소, 음식 종류 검색">
        <div class="rv-toolbar">
            <div class="rv-sort" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
                <select id="origin-select" aria-label="거리 기준 장소" onchange="onOriginSelectChange()">
                    <option value="">기준 장소 불러오는 중</option>
                </select>
                <select id="radius-select" aria-label="거리 범위" onchange="render()">
                    <option value="1000">1km 이내</option>
                    <option value="3000">3km 이내</option>
                    <option value="5000">5km 이내</option>
                </select>
                <select id="sort-select" onchange="render()">
                    <option value="count">리뷰 많은순</option>
                    <option value="rating">평점 높은순</option>
                    <option value="distance">거리순</option>
                </select>
                <button class="btn-write" onclick="location.href='/community'" style="margin-left:4px;">커뮤니티</button>
            </div>
            <p style="font-size:12px;color:#999;margin:6px 0 0;" id="origin-status"></p>
        </div>
        <p class="rv-count" id="rv-count" aria-live="polite">불러오는 중...</p><button class="rv-refresh" id="reload-btn">다시 조회</button><p class="rv-message" id="rv-warning" role="status"></p>

        <div class="rv-grid" id="rv-grid"></div>
    </div>
</main>

<footer class="footer">
    <div class="footer-inner">
        <div class="footer-brand">
            <span class="logo-mark">♜</span>
            <span><strong>BinGo Map</strong><small>Clean &amp; Gourmet</small></span>
        </div>
        <p>BinGo Map은 깨끗한 일본 여행 문화를 응원합니다.<br>모두가 함께 만들어가는 깨끗하고 즐거운 여행 플랫폼!</p>
        <div class="footer-links">
            <div>◎ ♥ f</div>
            <small>이용약관  개인정보처리방침  문의하기</small>
            <small>© 2026 BinGo Map. All rights reserved.</small>
        </div>
        <a class="top-btn" href="#">↑<small>TOP</small></a>
    </div>
</footer>

<script src="/map/bingo-spots.js"></script>
<script src="/reviews/review-data.js"></script>
<script>

const D = window.BinGoReviews, $ = id => document.getElementById(id);
let allRestaurants = [], reviewSummaries = new Map(), summaryReady = false, loading = false;
const spots = window.BinGoSpots?.SPOTS || [];
$('origin-select').innerHTML = spots.map(s => `<option value="${D.escape(s.id)}">${D.escape(s.label)}</option>`).join('');
// 화면을 열면 도톤보리 기준 1km 범위를 바로 적용합니다.
$('origin-select').value = (spots.find(s => s.id === 'dotonbori') || spots[0])?.id || '';
async function loadSummaries() {
    if (loading) return;
    loading = true; $('reload-btn').disabled = true;
    try {
        const [places, summaries] = await Promise.allSettled([D.restaurants(), D.summaries()]);
        if (places.status !== 'fulfilled') throw places.reason;
        allRestaurants = places.value;
        summaryReady = summaries.status === 'fulfilled';
        reviewSummaries = summaryReady ? summaries.value : new Map();
        $('rv-warning').textContent = summaryReady ? '' : '식당은 불러왔지만 리뷰 집계를 가져오지 못했습니다. 다시 조회해주세요.';
        render();
    } catch (e) {
        $('rv-warning').textContent = '목록을 갱신하지 못했습니다. 잠시 후 다시 조회해주세요.';
        if (!allRestaurants.length) { $('rv-grid').replaceChildren(); $('rv-count').textContent = '공개 식당을 불러오지 못했습니다.'; }
    } finally { loading = false; $('reload-btn').disabled = false; }
}
function onOriginSelectChange() { render(); }
function render() {
    const origin = spots.find(s => s.id === $('origin-select').value);
    const radius = Number($('radius-select').value), sort = $('sort-select').value;
    const keyword=$('restaurant-search').value.trim().toLocaleLowerCase();
    $('origin-status').textContent = origin ? `${origin.label} 기준 직선 거리 ${radius / 1000}km 이내입니다.` : '기준 장소를 불러오지 못했습니다. 페이지를 새로고침해주세요.';
    let list = allRestaurants.map(r => ({r,s:reviewSummaries.get(r.restaurantId),distance:origin ? D.distance(origin,r) : null}));
    if(keyword) list=list.filter(({r}) => [r.name,r.address,r.category].some(v => String(v||'').toLocaleLowerCase().includes(keyword)));
    list = origin ? list.filter(p => p.distance!==null && p.distance<=radius) : [];
    list.sort((a,b) => {
        const difference = sort==='distance' && origin ? (a.distance??Infinity)-(b.distance??Infinity) : sort==='rating' ? (Number(b.s?.avgRating)||0)-(Number(a.s?.avgRating)||0) : (Number(b.s?.reviewCount)||0)-(Number(a.s?.reviewCount)||0);
        return difference || a.r.name.localeCompare(b.r.name,'ko') || a.r.restaurantId.localeCompare(b.r.restaurantId);
    });
    $('rv-count').textContent = `공개 식당 ${allRestaurants.length}곳 · 현재 ${list.length}곳 표시`;
    $('rv-grid').innerHTML = list.map(({r,s,distance}) => {
        const count=Number(s?.reviewCount)||0, photo=D.photo(r.mainImageUrl);
        return `<article class="rv-card" data-restaurant-id="${r.restaurantId}">
          <a class="rv-card-link" href="/reviews/restaurant/${r.restaurantId}" aria-label="${D.escape(r.name)} 리뷰 보기">
            <div class="rv-thumb-wrap">${photo ? `<img loading="lazy" src="${D.escape(photo)}" alt="${D.escape(r.name)}">` : '<div class="rv-placeholder">🍽️</div>'}<span class="rv-badge">${summaryReady?`리뷰 ${count}개`:'리뷰 확인 중'}</span></div>
            <div class="rv-name">${D.escape(r.name)}</div>
            <div class="rv-sub-row">${D.escape(r.category||'식당')}</div>
            <div class="rv-sub-row"><span class="stars">${D.stars(summaryReady && count ? s?.avgRating : 0)}</span> <span class="rating-num">${D.escape(D.stats(s,summaryReady))}</span></div>
            <div class="rv-sub-row">${D.escape(r.address||'주소 정보 없음')}${distance!==null?` · ${distance<1000?Math.round(distance)+'m':(distance/1000).toFixed(1)+'km'}`:''}</div>
            <p class="rv-preview">${D.escape(summaryReady ? (s?.previewContent || '첫 리뷰를 남겨주세요.') : '리뷰 정보를 확인할 수 없습니다.')}</p>
            ${r.menuName ? `<div class="rv-sub-row">🍴 ${D.escape(r.menuName)} ${D.escape(r.menuPrice||'')}</div>` : ''}
          </a><div class="rv-actions"><a href="/reviews/restaurant/${r.restaurantId}">리뷰 보기</a><a href="/reviews/write?restaurantId=${r.restaurantId}">리뷰 쓰기</a></div></article>`;
    }).join('') || '<p class="rv-empty">조건에 맞는 공개 식당이 없습니다.</p>';
    $('rv-grid').querySelectorAll('img').forEach(img => img.addEventListener('error',() => { const placeholder=document.createElement('div');placeholder.className='rv-placeholder';placeholder.textContent='🍽️';img.replaceWith(placeholder); },{once:true}));
}
$('restaurant-search').addEventListener('input',render);
$('reload-btn').addEventListener('click',loadSummaries);
loadSummaries(); D.watch(loadSummaries);

</script>
<script src="/js/header-auth.js"></script>
</body>
</html>
